[package]
name = "sidechain"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
ort = { version = "2.0.0-rc.14", features = ["directml"] }
raw-window-handle = "0.6"
realfft = "3.5.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tray-icon = { version = "0.26", default-features = false }
wasapi = "0.26.0"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinSock", "Win32_System_WinRT", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
