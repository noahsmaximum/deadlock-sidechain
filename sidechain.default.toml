# Sidechain — Deadlock gameplay -> Spotify EQ.
# Edit here or in the settings window; this file hot-reloads on save.
#
# The idea: with nothing going on the track sits back (near-mono, quieter, no bass). As more
# happens at once — moving fast, fighting, shooting, landing hits, kills — ENERGY rises and the
# track opens up to full level, wide stereo, normal bass and a little extra treble. Individual
# events add their own flavour on top (damage muffles, dying goes underwater, kills hit like a drop).

[audio]
app = "Spotify.exe"                  # process whose audio gets processed
sink = "Steam Streaming Speakers"    # silent device the app is re-pointed to while we run
output = ""                          # where processed audio plays; "" = the app's previous device
latency_ms = 30                      # capture->output buffer (drift-corrected)
only_with_game = true                # leave Spotify alone unless deadlock.exe is running

[input]
netcon_port = 29000                  # matches Deadlock launch option  -netconport 29000
console_log = ""                     # "" = auto-detect <Deadlock>\game\citadel\console.log  (needs -condebug)

# Global: intensity scales every route (0.5 = half as strong, 1.5 = 50% stronger);
# trim_db is a constant output level offset.
[master]
intensity = 1.0
trim_db = 0.0

# ---------------------------------------------------------------------------------------------
# PARAMETERS. The calm state is [base]; routes add  amount x signal(0..1)  on top.
#   gain_db       output level
#   lowpass_oct   octaves below 20 kHz (negative)   -1 = 10k, -3 = 2.5k, -5 = 625 Hz
#   highpass_oct  octaves above 20 Hz (positive)    +1.5 = 57 Hz, +3 = 160 Hz, +5 = 640 Hz
#   resonance     lowpass resonance 0..1
#   bass_db       low shelf  @ 120 Hz
#   mid_db        bell       @ 1 kHz
#   treble_db     high shelf @ 6 kHz
#   width         stereo width (1 = as is, 0 = mono, 2 = extra wide)
#   drive         soft saturation 0..1
#   drums_db      drums stem level   (needs [stems] enabled)
#   vocals_db     vocals stem level
#   music_db      everything-else stem level
[base]
gain_db = -6.0
width = 0.25
bass_db = -10.0
highpass_oct = 1.5
drums_db = -30.0
vocals_db = -30.0

# Real-time approximate stems (CPU, ~43 ms): drums = percussive part, vocals = centred harmonic
# part in the vocal band, music = the rest. Calm keeps drums + vocals out; energy brings them in.
[stems]
enabled = true

# ---------------------------------------------------------------------------------------------
# SIGNALS. Pulses (events) jump by `strength` (scaled where noted) and decay; levels follow a state.
#   attack_ms / release_ms shape how fast a signal rises / falls. enabled = false mutes one.
[signals]
energy        = { attack_ms = 250, release_ms = 2500 }                    # derived, see [energy]
max_energy    = { attack_ms = 0,   release_ms = 1500, strength = 1.0 }    # energy just crossed 90%
fire          = { attack_ms = 0,   release_ms = 180,  strength = 1.0 }    # per bullet (ammo counter)
hit           = { attack_ms = 0,   release_ms = 150,  strength = 1.0 }    # hit marker on an enemy
crit          = { attack_ms = 0,   release_ms = 300,  strength = 1.0 }    # headshot / crit marker
damage_dealt  = { attack_ms = 0,   release_ms = 1500, strength = 1.0 }    # an enemy hero took your damage
damage        = { attack_ms = 5,   release_ms = 900,  scale = 5.0 }       # hp lost / max hp x scale
heal          = { attack_ms = 30,  release_ms = 600,  scale = 4.0 }
reload        = { attack_ms = 0,   release_ms = 300,  strength = 1.0 }
kill          = { attack_ms = 30,  release_ms = 3500, strength = 1.0 }
assist        = { attack_ms = 30,  release_ms = 2000, strength = 1.0 }
death         = { attack_ms = 0,   release_ms = 900,  strength = 1.0 }    # the moment you die
respawn       = { attack_ms = 0,   release_ms = 1500, strength = 1.0 }
ability       = { attack_ms = 0,   release_ms = 250,  strength = 1.0 }    # any ability cast
ultimate      = { attack_ms = 0,   release_ms = 1200, strength = 1.0 }    # slot 4
objective_win = { attack_ms = 200, release_ms = 7000, strength = 1.0 }    # enemy guardian/walker/shrine down
objective_loss= { attack_ms = 200, release_ms = 6000, strength = 1.0 }    # ours down
patron_win    = { attack_ms = 300, release_ms = 12000, strength = 1.0 }
midboss       = { attack_ms = 300, release_ms = 9000, strength = 1.0 }
# levels
dead          = { attack_ms = 400, release_ms = 1500 }
low_health    = { attack_ms = 300, release_ms = 1000, threshold = 0.35 }  # 0 above 35% hp -> 1 at 0 hp
# movespeed readout (HUD units): idle 0, walk ~362, sprint ~579, dash peaks ~700 — walking barely counts
speed         = { attack_ms = 150, release_ms = 600,  min = 300.0, max = 700.0 }
shop          = { attack_ms = 200, release_ms = 300 }
scoreboard    = { attack_ms = 150, release_ms = 300 }
combat        = { attack_ms = 500, release_ms = 3000 }

# ---------------------------------------------------------------------------------------------
# ENERGY = clamp(sum of weight x signal, 0..1). Standing / walking ~0; sprinting ~0.35; dashing 0.5;
# a fight with shooting and hits pushes it to 1. Negative weights pull it down (dead).
[energy.weights]
speed         = 0.5
combat        = 0.3
fire          = 0.35
hit           = 0.25
crit          = 0.3
damage_dealt  = 0.3
damage        = 0.4
ability       = 0.25
ultimate      = 0.6
kill          = 0.9
assist        = 0.5
objective_win = 0.6
midboss       = 0.8
patron_win    = 1.0
dead          = -1.0

# ---------------------------------------------------------------------------------------------
# ROUTES — the sound design. Press `b` while running (or Bypass in the window) to A/B.
[mix]
routes = [
  # ENERGY: calm (base) -> full: level back to 0 dB, near-mono -> wide, bass and sub back, a
  # touch more treble
  { signal = "energy",         param = "gain_db",      amount = 6.0 },
  { signal = "energy",         param = "width",        amount = 0.9 },
  { signal = "energy",         param = "bass_db",      amount = 10.0 },
  { signal = "energy",         param = "highpass_oct", amount = -1.5 },
  { signal = "energy",         param = "treble_db",    amount = 2.5 },
  # hitting max energy: a quick lift so you can hear you got there
  { signal = "max_energy",     param = "treble_db",    amount = 4.0 },
  { signal = "max_energy",     param = "width",        amount = 0.4 },
  { signal = "max_energy",     param = "drive",        amount = 0.15 },
  # stems: vocals come in through the middle of the energy range, drums only near the top
  # (from / to = the slice of the signal over which a route ramps from nothing to full)
  { signal = "energy",         param = "vocals_db",    amount = 30.0, from = 0.15, to = 0.55 },
  { signal = "energy",         param = "drums_db",     amount = 30.0, from = 0.55, to = 0.95 },
  # guns punch through: every shot pumps the low end + level like a sidechain compressor
  { signal = "fire",           param = "bass_db",      amount = -6.0 },
  { signal = "fire",           param = "gain_db",      amount = -3.0 },
  # landing shots sparkle, crits more so
  { signal = "hit",            param = "treble_db",    amount = 3.0 },
  { signal = "crit",           param = "treble_db",    amount = 6.0 },
  { signal = "crit",           param = "mid_db",       amount = 3.0 },
  # casting thins the track for a beat; ult is a big high-pass whoosh that falls back in
  { signal = "ability",        param = "highpass_oct", amount = 1.2 },
  { signal = "ultimate",       param = "highpass_oct", amount = 3.5 },
  # taking damage muffles the track for a moment
  { signal = "damage",         param = "lowpass_oct",  amount = -4.5 },
  { signal = "damage",         param = "gain_db",      amount = -3.0 },
  # low health: closing in
  { signal = "low_health",     param = "lowpass_oct",  amount = -2.5 },
  { signal = "low_health",     param = "width",        amount = -0.5 },
  # dead: underwater
  { signal = "dead",           param = "lowpass_oct",  amount = -5.5 },
  { signal = "dead",           param = "resonance",    amount = 0.4 },
  { signal = "dead",           param = "gain_db",      amount = -6.0 },
  # back in: a bright swell
  { signal = "respawn",        param = "treble_db",    amount = 5.0 },
  { signal = "respawn",        param = "width",        amount = 0.5 },
  # kills hit like a drop
  { signal = "kill",           param = "bass_db",      amount = 5.0 },
  { signal = "kill",           param = "treble_db",    amount = 4.0 },
  { signal = "kill",           param = "gain_db",      amount = 2.0 },
  { signal = "kill",           param = "drive",        amount = 0.4 },
  { signal = "kill",           param = "width",        amount = 0.4 },
  { signal = "assist",         param = "bass_db",      amount = 3.0 },
  { signal = "assist",         param = "treble_db",    amount = 2.0 },
  # objectives
  { signal = "objective_win",  param = "bass_db",      amount = 5.0 },
  { signal = "objective_win",  param = "treble_db",    amount = 5.0 },
  { signal = "objective_win",  param = "width",        amount = 0.5 },
  { signal = "objective_win",  param = "drive",        amount = 0.3 },
  { signal = "objective_loss", param = "mid_db",       amount = -6.0 },
  { signal = "objective_loss", param = "lowpass_oct",  amount = -2.0 },
  { signal = "objective_loss", param = "gain_db",      amount = -3.0 },
  { signal = "patron_win",     param = "bass_db",      amount = 6.0 },
  { signal = "patron_win",     param = "treble_db",    amount = 6.0 },
  { signal = "patron_win",     param = "width",        amount = 0.8 },
  { signal = "patron_win",     param = "gain_db",      amount = 2.0 },
  { signal = "midboss",        param = "bass_db",      amount = 6.0 },
  { signal = "midboss",        param = "treble_db",    amount = 5.0 },
  { signal = "midboss",        param = "width",        amount = 0.6 },
  { signal = "midboss",        param = "gain_db",      amount = 2.0 },
  # shop: music in the next room
  { signal = "shop",           param = "lowpass_oct",  amount = -2.5 },
  { signal = "shop",           param = "gain_db",      amount = -3.0 },
]

# ---------------------------------------------------------------------------------------------
# TEXT RULES map HUD messages to signals. First match wins; regex syntax (Rust `regex`).
#   source = "team"  objective banners ("Enemy Yellow Tier 1" / "DESTROYED"); `positive` = good for you
#   source = "toast" game announcements (title + description)
[text]
rules = [
  { source = "team",  match = "(?i)patron",           positive = true,  signal = "patron_win" },
  { source = "team",  match = "",                     positive = true,  signal = "objective_win" },
  { source = "team",  match = "",                     positive = false, signal = "objective_loss" },
  { source = "toast", match = "(?i)mid.?boss|rejuv",                    signal = "midboss" },
]
